<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アプリ一覧</title>
<meta name="description" content="Claude Code で作ったアプリの入口">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#101218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アプリ">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top, 0px) + 48px) 20px calc(env(safe-area-inset-bottom, 0px) + 48px);
    background: #101218;
    color: #eceaf3;
    font-family: "Hiragino Sans", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .lead { color: #9a95ab; font-size: .84rem; margin: 0 0 28px; }
  .app {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid #2c2a3a;
    border-radius: 16px;
    background: #191b24;
    color: inherit;
    text-decoration: none;
  }
  .app:active { transform: scale(.99); }
  .app img { width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0; }
  .app h2 { font-size: 1rem; margin: 0; }
  .app p { margin: 2px 0 0; color: #9a95ab; font-size: .8rem; }
  footer { color: #6f6a80; font-size: .76rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1>アプリ一覧</h1>
  <p class="lead">使いたいアプリを開いて、ホーム画面に追加してください。</p>

  <a class="app" href="./karaoke/">
    <img src="./karaoke/icons/icon-192.png" alt="">
    <span>
      <h2>カラオケ レパートリー帳</h2>
      <p>歌える曲と練習したい曲を、キーと感想つきで記録する</p>
    </span>
  </a>

  <a class="app" href="./bubble_money/">
    <img src="./bubble_money/icons/icon-192.png" alt="">
    <span>
      <h2>あわ貯金</h2>
      <p>ほしいものを泡に閉じこめて、見送った金額をコインに変える</p>
    </span>
  </a>

  <footer>
    どちらも記録は端末の中だけに保存され、オフラインでも使えます。
  </footer>
</main>

<script>
  // このページを電波がなくても開けるようにする。
  // ここで登録する Service Worker は入口ページ自身のファイルだけを扱い、
  // 各アプリ（karaoke/ や bubble_money/）の通信には手を出さない。
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
